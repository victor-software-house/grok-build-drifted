name: Sync upstream

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: true

jobs:
  sync:
    # A public repository runs on GitHub's standard runners, which are free
    # here; one API call needs no more.
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream main
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method POST
          "repos/${GITHUB_REPOSITORY}/merge-upstream"
          -f branch=main